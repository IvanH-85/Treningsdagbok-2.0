<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f5597">
<title>Espen og Ivans treningsdagbok</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--b:#2f5597;--lb:#d9e2f3;--y:#fff2cc;--gr:#e7e6e6;--line:#c8d2e2;--bg:#f5f7fb;--ok:#e2f0d9;--reply:#f4f6fa}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:#172033}
header{position:sticky;top:0;z-index:10;background:var(--b);color:#fff;padding:12px 16px}.headrow{display:flex;justify-content:space-between;align-items:center;gap:10px}header h1{font-size:18px;margin:0}.who{font-size:12px;opacity:.9;margin-top:3px}
.wrap{max-width:900px;margin:auto;padding:12px 10px 80px}.tabs{display:flex;gap:5px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}.tab{flex:0 0 auto;border:0;border-radius:9px;padding:10px 12px;background:#fff;font-weight:700;font-size:12px}.tab.active{background:var(--b);color:#fff}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0001}h2{font-size:18px;margin:0 0 10px}h3{margin:8px 0;font-size:15px}.muted{font-size:12px;color:#6b7589}.plan{display:grid;grid-template-columns:70px 1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid #eee;align-items:center}.badge{background:var(--lb);border-radius:7px;padding:5px;font-size:12px;font-weight:700;text-align:center}
label{display:block;font-size:12px;font-weight:700;margin:8px 0 4px}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit}textarea{min-height:64px}.btn{border:0;border-radius:9px;padding:11px 14px;background:var(--b);color:#fff;font-weight:700}.btn.secondary{background:#eef2f8;color:#22314d}.btn.small{padding:7px 10px;font-size:12px}.btn.danger{background:#f3e8e8;color:#7a2525}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.hidden{display:none!important}.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:650px;font-size:12px}th,td{border:1px solid var(--line);padding:6px;text-align:center}th{background:var(--lb)}th:first-child,td:first-child{text-align:left;min-width:170px}.kv{background:var(--gr);font-weight:700;text-align:center}.edit{background:var(--y)}.unitwrap{position:relative}.unit{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:#6c7688}.unitinput{padding-right:33px}
.hist{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:4px;font-size:12px}.hist>div{background:#f8f9fc;padding:7px;border-radius:6px}.hist .h{background:var(--lb);font-weight:700}.round{border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0}.row3{display:grid;grid-template-columns:1.4fr .8fr .8fr;gap:6px;align-items:center;margin-top:7px}
.auth{max-width:430px;margin:36px auto}.auth .person{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.person button{border:2px solid var(--b);background:#fff;color:var(--b);padding:11px 4px;border-radius:10px;font-weight:800}.person button.active{background:var(--b);color:#fff}
.people{display:grid;grid-template-columns:1fr 1fr;gap:10px}.personcard{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.personcard h3{margin:0 0 7px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stat{background:#f5f7fb;border-radius:8px;padding:8px;text-align:center}.stat b{display:block;font-size:18px}.click{cursor:pointer;border:2px solid transparent}.click:hover{border-color:var(--b)}
.workout{border:1px solid var(--line);border-radius:12px;padding:11px;margin:10px 0;background:#fafbfe}.workhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.workactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.comment{background:var(--ok);border-radius:9px;padding:9px;margin-top:8px}.comment.reply{background:var(--reply);margin-left:18px;border-left:3px solid var(--b)}.comment b{font-size:12px}.commentbox{border-top:1px solid #ddd;margin-top:10px;padding-top:8px}.replybox{margin:7px 0 0 18px}.replylink{border:0;background:transparent;color:var(--b);font-weight:700;padding:4px 5px 4px 0;font-size:12px}.editing{border:2px solid var(--b);background:#f7faff}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#172033;color:#fff;padding:10px 14px;border-radius:9px;opacity:0;transition:.2s;z-index:30}.toast.show{opacity:1}
@media(max-width:650px){.people{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.plan{grid-template-columns:62px 1fr auto}.row3{grid-template-columns:1.3fr .8fr .8fr}}
</style>
</head>
<body>
<header><div class="headrow"><div><h1>Espen og Ivans treningsdagbok</h1><div id="who" class="who">Ikke innlogget</div></div><button id="logoutBtn" class="btn small secondary hidden" onclick="logout()">Logg ut</button></div></header>
<div class="wrap">
<div id="authView" class="auth"><div class="card"><h2>Logg inn</h2><div class="muted">Ivan og Espen registrerer trening. Amund har Coach-tilgang for oppfølging og kommentarer.</div><label>Bruker</label><div class="person"><button id="authIvan" class="active" onclick="chooseName('Ivan')">Ivan</button><button id="authEspen" onclick="chooseName('Espen')">Espen</button><button id="authAmund" onclick="chooseName('Amund')">Amund</button></div><label>E-post</label><input id="email" type="email" autocomplete="email"><label>Passord</label><input id="password" type="password" autocomplete="current-password" minlength="6"><div class="actions"><button class="btn" onclick="login()">Logg inn</button><button class="btn secondary" onclick="signup()">Opprett bruker</button></div><div id="authMsg" class="muted" style="margin-top:10px"></div></div></div>
<div id="appView" class="hidden"><div id="tabs" class="tabs"></div><section id="home"></section><section id="ivan" class="hidden"></section><section id="espen" class="hidden"></section><section id="w1" class="hidden"></section><section id="w2" class="hidden"></section><section id="w3" class="hidden"></section><section id="w4" class="hidden"></section></div>
</div><div id="toast" class="toast">Lagret</div>
<script>
const SUPABASE_URL='https://pzplzibottygdcvrzarn.supabase.co';
const SUPABASE_KEY='sb_publishable_ioP6vvml-6iqMk4TB5LLGQ_vL0FlfKE';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const LEGACY_KEY='ei_trening_app_v2_users';
const ex1=[
{name:'Markløft',plan:'3 x 12',kind:'weight',reps:[12,12,12]},
{name:'Bulgarian split',plan:'3 sett – start KV x 6',kind:'kvreps',reps:[6,6,6]},
{name:'Pullups',plan:'3 x maks',kind:'max',reps:['','','']},
{name:'Omvendt flyes med manualer',plan:'3 x 12',kind:'weight',reps:[12,12,12]},
{name:'Brystpress med manual i skråbenk',plan:'3 x 12',kind:'weight',reps:[12,12,12]},
{name:'Dips',plan:'3 x maks',kind:'max',reps:['','','']},
{name:'Biceps curls med manual',plan:'3 x 12 hver arm',kind:'weight',reps:['12 hver arm','12 hver arm','12 hver arm']}];
const ex3=[
{name:'Sumosquat',plan:'15',kind:'kv',reps:'15'},
{name:'Sandbag to shoulder',plan:'20 (10 hver side)',kind:'sharedweight',reps:'20'},
{name:'Armheving',plan:'Maks',kind:'max',reps:''},
{name:'Mountainclimbers',plan:'20 (10 hver side)',kind:'kv',reps:'20'},
{name:'Ground to air',plan:'12 hver arm',kind:'sharedweight',reps:'12'},
{name:'Burpees',plan:'8',kind:'kv',reps:'8'}];
function ivanSeed(){return{w1:[{date:'2026-08-25',ex:{'Markløft':{w:[30,30,30],r:[12,12,12]},'Bulgarian split':{w:['KV','KV','KV'],r:[6,6,6]},'Pullups':{w:['KV','KV','KV'],r:[5,3,2]},'Omvendt flyes med manualer':{w:[4,4,4],r:[12,12,12]},'Brystpress med manual i skråbenk':{w:[10,12.5,12.5],r:[12,12,12]},'Dips':{w:['KV','KV','KV'],r:[12,10,10]},'Biceps curls med manual':{w:[6,6,6],r:['12 hver arm','12 hver arm','12 hver arm']}}}],w2:[],w3:[],w4:[]}}
function emptySeed(){return{w1:[],w2:[],w3:[],w4:[]}}
let chosenName='Ivan',currentUser=null,currentProfile=null,d=emptySeed(),profiles=[],states={},comments=[],editTarget=null;
const q=s=>document.querySelector(s),today=()=>new Date().toISOString().slice(0,10);
const uid=()=>window.crypto?.randomUUID?crypto.randomUUID():'id_'+Date.now()+'_'+Math.random().toString(36).slice(2);
function chooseName(n){chosenName=n;['Ivan','Espen','Amund'].forEach(x=>q('#auth'+x).classList.toggle('active',x===n))}
function authMessage(t){q('#authMsg').textContent=t||''}
function showToast(t='Lagret og synkronisert'){let x=q('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1400)}
function kg(v){if(v===''||v==null)return'-';if(v==='KV')return'KV';let n=Number(v);return Number.isFinite(n)?n.toFixed(1).replace('.',',')+'kg':String(v)}
function stk(v){return(v===''||v==null)?'-':v+' stk'}
function esc(s){return String(s??'').replace(/[&<>'\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[m]))}
function hashObj(obj){let s=JSON.stringify(obj),h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h)^s.charCodeAt(i);return (h>>>0).toString(36)}
function workoutRef(k,x){return x?._id||k+'_'+(x.date||'nodate')+'_'+hashObj(x)}
function profileByName(n){return profiles.find(p=>p.name===n)}
function profileById(id){return profiles.find(p=>p.id===id)}
function stateByName(n){let p=profileByName(n);return p&&states[p.id]?states[p.id]:emptySeed()}
function isCoach(){return currentProfile?.role==='coach'}
function isOwnName(n){return currentProfile?.name===n}
function authorLabel(id){let p=profileById(id);if(!p)return'Ukjent';return p.name+(p.role==='coach'?' • Coach':'')}
function currentEdit(k){return editTarget?.k===k?d[k]?.[editTarget.i]:null}
function timeToSeconds(v){let s=String(v||'').trim();if(!s)return null;let p=s.split(':');if(p.length===1){let n=Number(p[0]);return Number.isFinite(n)?Math.round(n*60):null}if(p.length!==2)return null;let m=Number(p[0]),sec=Number(p[1]);if(!Number.isFinite(m)||!Number.isFinite(sec)||m<0||sec<0||sec>=60)return null;return Math.round(m*60+sec)}
function secondsToTime(sec){sec=Math.max(0,Math.round(sec));let m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function updateW3Total(){let vals=[];for(let r=1;r<=4;r++)vals.push(timeToSeconds(q(`[data-rt="${r}"]`)?.value));let out=q('#w3tot');if(!out)return;if(vals.some(v=>v===null)){out.value='';return}out.value=secondsToTime(vals.reduce((a,b)=>a+b,0)+(3*120))}
async function signup(){const email=q('#email').value.trim(),password=q('#password').value;if(!email||password.length<6){authMessage('Skriv inn e-post og et passord på minst 6 tegn.');return}authMessage('Oppretter bruker...');const {data,error}=await sb.auth.signUp({email,password,options:{data:{name:chosenName},emailRedirectTo:location.origin+location.pathname}});if(error){authMessage(error.message);return}if(data.session){await startSession(data.session.user)}else authMessage('Brukeren er opprettet. Sjekk e-posten og bekreft kontoen.')}
async function login(){const email=q('#email').value.trim(),password=q('#password').value;authMessage('Logger inn...');const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){authMessage(error.message);return}await startSession(data.user)}
async function logout(){await sb.auth.signOut();currentUser=null;currentProfile=null;editTarget=null;q('#appView').classList.add('hidden');q('#authView').classList.remove('hidden');q('#logoutBtn').classList.add('hidden');q('#who').textContent='Ikke innlogget';authMessage('Logget ut.')}
async function ensureProfile(user){let {data:p,error}=await sb.from('profiles').select('id,name,role').eq('id',user.id).maybeSingle();if(error)throw error;if(!p){let name=user.user_metadata?.name||chosenName;const ins=await sb.from('profiles').insert({id:user.id,name}).select('id,name,role').single();if(ins.error)throw ins.error;p=ins.data}return p}
function getLegacy(name){try{const s=JSON.parse(localStorage.getItem(LEGACY_KEY)||'null');if(s&&s[name])return s[name]}catch(e){}return name==='Ivan'?ivanSeed():emptySeed()}
async function ensureOwnState(){if(isCoach())return;let res=await sb.from('user_state').select('data').eq('user_id',currentUser.id).maybeSingle();if(res.error)throw res.error;if(!res.data){let seed=getLegacy(currentProfile.name);let ins=await sb.from('user_state').insert({user_id:currentUser.id,data:seed});if(ins.error)throw ins.error}}
async function loadAll(){let [pr,st,co]=await Promise.all([sb.from('profiles').select('id,name,role,created_at'),sb.from('user_state').select('user_id,data,updated_at'),sb.from('workout_comments').select('id,workout_owner_id,workout_ref,workout_type,workout_date,author_id,parent_id,comment,created_at').order('created_at',{ascending:true})]);if(pr.error)throw pr.error;if(st.error)throw st.error;if(co.error)throw co.error;profiles=pr.data||[];states={};(st.data||[]).forEach(x=>states[x.user_id]=x.data||emptySeed());comments=co.data||[];d=isCoach()?emptySeed():(states[currentUser.id]||emptySeed())}
async function save(msg='Lagret og synkronisert'){if(isCoach())return;states[currentUser.id]=d;const r=await sb.from('user_state').upsert({user_id:currentUser.id,data:d,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(r.error){alert('Kunne ikke synkronisere: '+r.error.message);return}await loadAll();renderPages();showToast(msg)}
async function startSession(user){try{currentUser=user;currentProfile=await ensureProfile(user);await ensureOwnState();await loadAll();q('#authView').classList.add('hidden');q('#appView').classList.remove('hidden');q('#logoutBtn').classList.remove('hidden');q('#who').textContent='Innlogget: '+currentProfile.name+(isCoach()?' • Coach':' • skylagring aktiv');renderTabs();renderPages();authMessage('')}catch(e){authMessage('Oppsettfeil: '+e.message);await sb.auth.signOut()}}
function renderTabs(){let a=[['home','Start'],['ivan','Ivan'],['espen','Espen']];if(!isCoach())a.push(['w1','Økt 1'],['w2','Økt 2'],['w3','Økt 3'],['w4','Økt 4']);q('#tabs').innerHTML=a.map((x,i)=>`<button class="tab ${i===0?'active':''}" data-p="${x[0]}">${x[1]}</button>`).join('');q('#tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>showPage(b.dataset.p))}
function showPage(p){q('#tabs').querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.p===p));['home','ivan','espen','w1','w2','w3','w4'].forEach(x=>q('#'+x).classList.toggle('hidden',x!==p));scrollTo(0,0)}
function totalCount(s){return ['w1','w2','w3','w4'].reduce((n,k)=>n+(s[k]?.length||0),0)}
function latestWorkout(s){let all=[];['w1','w2','w3','w4'].forEach(k=>(s[k]||[]).forEach(x=>all.push({k,date:x.date||'',x})));all.sort((a,b)=>b.date.localeCompare(a.date));return all[0]}
function progressMini(s){let f=s.w1?.[0],l=s.w1?.[s.w1.length-1];if(!f||!l)return'Ingen styrkeøkter ennå';let a=f.ex?.['Markløft']?.w?.[0],b=l.ex?.['Markløft']?.w?.[0];return `Markløft: ${kg(a)} → ${kg(b)}`}
function personSummary(name){let s=stateByName(name),last=latestWorkout(s);return `<div class="personcard click" onclick="showPage('${name.toLowerCase()}')"><h3>${name}</h3><div class="stats"><div class="stat"><b>${totalCount(s)}</b><span class="muted">økter</span></div><div class="stat"><b>${s.w1?.length||0}</b><span class="muted">styrke 1</span></div><div class="stat"><b>${s.w3?.length||0}</b><span class="muted">sirkel</span></div><div class="stat"><b>${last?.date||'-'}</b><span class="muted">sist</span></div></div><div class="muted" style="margin-top:8px">${progressMini(s)}</div></div>`}
function renderHome(){let coachNote=isCoach()?'<div class="card"><b>Coach-visning</b><div class="muted" style="margin-top:5px">Velg Ivan eller Espen for detaljer og kommentarer.</div></div>':'';q('#home').innerHTML=`${coachNote}<div class="card"><h2>Felles oversikt</h2><div class="muted" style="margin-bottom:10px">Utførte økter og progresjon for Ivan og Espen.</div><div class="people">${personSummary('Ivan')}${personSummary('Espen')}</div></div><div class="card"><h2>Siste aktivitet</h2>${recentActivity()}</div>`}
function recentActivity(){let arr=[];['Ivan','Espen'].forEach(name=>{let s=stateByName(name);['w1','w2','w3','w4'].forEach(k=>(s[k]||[]).forEach(x=>arr.push({name,k,date:x.date||'',x})))});arr.sort((a,b)=>b.date.localeCompare(a.date));return arr.slice(0,8).map(a=>`<div class="plan"><span class="badge">${a.name}</span><div><b>${labelWorkout(a.k)}</b><div class="muted">${shortSummary(a.k,a.x)}</div></div><span>${a.date}</span></div>`).join('')||'<div class="muted">Ingen registreringer ennå.</div>'}
function labelWorkout(k){return({w1:'Økt 1',w2:'Økt 2',w3:'Økt 3',w4:'Økt 4'})[k]}
function shortSummary(k,x){if(k==='w1')return'Styrke 1';if(k==='w3')return'Total tid '+(x.total||'-');return (x.type||'Aktivitet')+(x.time?' – '+x.time+' min':'')}
function progressHtml(s){let f=s.w1?.[0],l=s.w1?.[s.w1.length-1];if(!f||!l)return'<div class="muted">Ingen Økt 1 registrert ennå.</div>';return ex1.map(e=>{let a=f.ex?.[e.name],b=l.ex?.[e.name],av='-',bv='-';if(a){av=e.kind==='max'?a.r.map(stk).join(' / '):e.kind==='kvreps'?a.r.map((x,i)=>kg(a.w[i])+' x '+x).join(' / '):a.w.map(kg).join(' / ')}if(b){bv=e.kind==='max'?b.r.map(stk).join(' / '):e.kind==='kvreps'?b.r.map((x,i)=>kg(b.w[i])+' x '+x).join(' / '):b.w.map(kg).join(' / ')}return `<div class="hist"><div><b>${e.name}</b></div><div>${av}</div><div>${bv}</div></div>`}).join('')}
function renderPerson(name){let s=stateByName(name),p=profileByName(name);let html=`<div class="card"><h2>${name}</h2><div class="stats"><div class="stat"><b>${totalCount(s)}</b><span class="muted">totalt</span></div><div class="stat"><b>${s.w1?.length||0}</b><span class="muted">Økt 1</span></div><div class="stat"><b>${s.w3?.length||0}</b><span class="muted">Økt 3</span></div><div class="stat"><b>${comments.filter(c=>c.workout_owner_id===p?.id).length}</b><span class="muted">kommentarer</span></div></div></div><div class="card"><h2>Økt 1 – progresjon</h2><div class="hist"><div class="h">Øvelse</div><div class="h">Første</div><div class="h">Nå</div></div>${progressHtml(s)}</div>`;['w1','w2','w3','w4'].forEach(k=>html+=historyForPerson(name,k,s[k]||[]));q('#'+name.toLowerCase()).innerHTML=html}
function historyForPerson(name,k,arr){let p=profileByName(name);return `<div class="card"><h2>${labelWorkout(k)} – historikk</h2>${arr.slice().reverse().map((x,ri)=>workoutCard(name,p,k,x,arr.length-1-ri)).join('')||'<div class="muted">Ingen registreringer ennå.</div>'}</div>`}
function commentThread(cs,ownerId,ref,k,date){let roots=cs.filter(c=>!c.parent_id);return roots.map(c=>{let replies=cs.filter(r=>r.parent_id===c.id);return `<div class="comment"><b>${esc(authorLabel(c.author_id))}</b><div>${esc(c.comment)}</div><div class="muted">${new Date(c.created_at).toLocaleString('no-NO')}</div><button class="replylink" onclick="toggleReply(${c.id})">Svar</button>${c.author_id===currentUser.id?`<button class="replylink" onclick="deleteComment(${c.id})">Slett</button>`:''}</div>${replies.map(r=>`<div class="comment reply"><b>${esc(authorLabel(r.author_id))}</b><div>${esc(r.comment)}</div><div class="muted">${new Date(r.created_at).toLocaleString('no-NO')}</div>${r.author_id===currentUser.id?`<button class="replylink" onclick="deleteComment(${r.id})">Slett</button>`:''}</div>`).join('')}<div id="reply_${c.id}" class="replybox hidden"><textarea id="replytext_${c.id}" placeholder="Skriv svar"></textarea><button class="btn small" onclick="addReply(${c.id},'${ownerId}','${ref}','${k}','${date}')">Svar</button></div>`}).join('')}
function workoutCard(name,p,k,x,index){let ref=workoutRef(k,x),cs=comments.filter(c=>c.workout_owner_id===p?.id&&c.workout_ref===ref);let detail='';if(k==='w1')detail=ex1.map(e=>{let z=x.ex?.[e.name];return z?`<div><b>${e.name}:</b> ${e.kind==='max'?z.r.map(stk).join(' / '):e.kind==='kvreps'?z.r.map((r,i)=>kg(z.w[i])+' x '+r).join(' / '):z.w.map(kg).join(' / ')}</div>`:''}).join('');else if(k==='w3')detail=`<div><b>Total:</b> ${x.total||'-'}</div><div>${(x.rounds||[]).map((r,i)=>`R${i+1}: ${r.time||'-'}`).join(' • ')}</div>`;else detail=`<div><b>${x.type||'Aktivitet'}</b> ${x.time?x.time+' min':''} ${x.dist?x.dist+' km':''}</div>${x.com?`<div class="muted">${esc(x.com)}</div>`:''}`;let edit=isOwnName(name)&&!isCoach()?`<div class="workactions"><button class="btn small secondary" onclick="beginEdit('${k}',${index})">Rediger økt</button></div>`:'';return `<div class="workout"><div class="workhead"><div><b>${labelWorkout(k)} – ${name}</b><div class="muted">${x.date||'-'}</div></div><span class="badge">${shortSummary(k,x)}</span></div><div style="margin-top:8px">${detail}</div>${edit}${commentThread(cs,p?.id,ref,k,x.date)}<div class="commentbox"><label>Ny kommentar</label><textarea id="comment_${ref}" placeholder="Skriv kommentar til denne økten"></textarea><button class="btn small" onclick="addComment('${p?.id}','${ref}','${k}','${x.date}')">Legg inn kommentar</button></div></div>`}
function toggleReply(id){q('#reply_'+id)?.classList.toggle('hidden')}
async function addComment(ownerId,ref,k,date){let el=q('#comment_'+ref),text=el?.value.trim();if(!text)return;let r=await sb.from('workout_comments').insert({workout_owner_id:ownerId,workout_ref:ref,workout_type:k,workout_date:date,author_id:currentUser.id,comment:text});if(r.error){alert('Kunne ikke lagre kommentar: '+r.error.message);return}await loadAll();renderPages();showToast('Kommentar lagret')}
async function addReply(parentId,ownerId,ref,k,date){let el=q('#replytext_'+parentId),text=el?.value.trim();if(!text)return;let r=await sb.from('workout_comments').insert({workout_owner_id:ownerId,workout_ref:ref,workout_type:k,workout_date:date,author_id:currentUser.id,parent_id:parentId,comment:text});if(r.error){alert('Kunne ikke lagre svar: '+r.error.message);return}await loadAll();renderPages();showToast('Svar lagret')}
async function deleteComment(id){if(!confirm('Slette kommentaren?'))return;let r=await sb.from('workout_comments').delete().eq('id',id);if(r.error){alert(r.error.message);return}await loadAll();renderPages();showToast('Kommentar slettet')}
function beginEdit(k,i){if(isCoach())return;editTarget={k,i};let x=d[k][i];if(x&&!x._id)x._id=workoutRef(k,x);renderPages();showPage(k);setTimeout(()=>{scrollTo(0,0);if(k==='w3')updateW3Total()},20)}
function cancelEdit(){let k=editTarget?.k;editTarget=null;renderPages();if(k)showPage(k)}
function editBanner(k){if(editTarget?.k!==k)return'';return `<div class="card editing"><b>Redigerer gjennomført ${labelWorkout(k)}</b><div class="muted" style="margin-top:4px">Endre opplysningene og trykk Oppdater økt. Kommentarene beholdes.</div><button class="btn small secondary" style="margin-top:8px" onclick="cancelEdit()">Avbryt redigering</button></div>`}
function w1form(){let ed=currentEdit('w1');let rows=ex1.map((e,i)=>{let z=ed?.ex?.[e.name],c='';for(let s=0;s<3;s++){let w=z?.w?.[s]??(e.kind==='kvreps'?'KV':''),r=z?.r?.[s]??e.reps[s]??'';if(e.kind==='max'){c+=`<td class="kv">KV</td><td><input class="edit" inputmode="numeric" data-e="${i}" data-s="${s}" data-t="r" value="${esc(r)}"></td>`}else if(e.kind==='kvreps'){c+=`<td><input class="edit" data-e="${i}" data-s="${s}" data-t="w" value="${esc(w)}"></td><td><input class="edit" inputmode="numeric" data-e="${i}" data-s="${s}" data-t="r" value="${esc(r)}"></td>`}else{c+=`<td><div class="unitwrap"><input class="edit unitinput" inputmode="decimal" data-e="${i}" data-s="${s}" data-t="w" value="${esc(w)}"><span class="unit">kg</span></div></td><td><input data-e="${i}" data-s="${s}" data-t="r" value="${esc(r)}"></td>`}}return `<tr><td><b>${e.name}</b><br><span class="muted">${e.plan}</span></td>${c}</tr>`}).join('');return `${editBanner('w1')}<div class="card ${ed?'editing':''}"><h2>${ed?'Rediger':'Ny'} Økt 1 – ${currentProfile.name}</h2><label>Dato</label><input id="w1date" type="date" value="${ed?.date||today()}"><div class="scroll"><table><tr><th>Øvelse</th><th>S1 vekt</th><th>S1 reps</th><th>S2 vekt</th><th>S2 reps</th><th>S3 vekt</th><th>S3 reps</th></tr>${rows}</table></div><button class="btn" style="margin-top:10px" onclick="saveW1()">${ed?'Oppdater økt':'Lagre økt'}</button></div>`}
async function saveW1(){let ed=currentEdit('w1'),old=ed?workoutRef('w1',ed):null,o={_id:ed?ed._id||old:uid(),date:q('#w1date').value,ex:{}};ex1.forEach((e,i)=>{let w=[],r=[];for(let s=0;s<3;s++){let W=q(`[data-e="${i}"][data-s="${s}"][data-t="w"]`),R=q(`[data-e="${i}"][data-s="${s}"][data-t="r"]`);w.push(W?(W.value.toUpperCase()==='KV'?'KV':W.value===''?'':Number(W.value.replace(',','.'))):'KV');r.push(R?R.value:'')}o.ex[e.name]={w,r}});if(ed){d.w1[editTarget.i]=o;editTarget=null;await save('Økten er oppdatert')}else{d.w1.push(o);await save()}showPage('w1')}
function activity(key,title,choices,mins){let ed=currentEdit(key);return `${editBanner(key)}<div class="card ${ed?'editing':''}"><h2>${ed?'Rediger':'Ny'} ${title} – ${currentProfile.name}</h2><label>Dato</label><input id="${key}date" type="date" value="${ed?.date||today()}"><label>Aktivitet</label><select id="${key}type">${choices.map(x=>`<option ${ed?.type===x?'selected':''}>${x}</option>`).join('')}</select><label>Tid</label><div class="unitwrap"><input id="${key}time" type="number" value="${ed?.time??mins}"><span class="unit">min</span></div><label>Distanse (valgfritt)</label><div class="unitwrap"><input id="${key}dist" type="number" step="0.1" value="${ed?.dist??''}"><span class="unit">km</span></div><label>Kommentar</label><textarea id="${key}com">${esc(ed?.com??'')}</textarea><button class="btn" onclick="saveAct('${key}')">${ed?'Oppdater økt':'Marker som utført'}</button></div>`}
async function saveAct(k){let ed=currentEdit(k),old=ed?workoutRef(k,ed):null,o={_id:ed?ed._id||old:uid(),date:q('#'+k+'date').value,type:q('#'+k+'type').value,time:q('#'+k+'time').value,dist:q('#'+k+'dist').value,com:q('#'+k+'com').value};if(ed){d[k][editTarget.i]=o;editTarget=null;await save('Økten er oppdatert')}else{d[k].push(o);await save()}showPage(k)}
function sharedWeightInput(e,i,r,val){if(e.kind!=='sharedweight')return'';if(r===1)return `<div class="unitwrap"><input class="edit unitinput" data-r="${r}" data-i="${i}" data-t="w" inputmode="decimal" value="${esc(val??'')}" oninput="syncCircleWeight(${i},this.value)"><span class="unit">kg</span></div>`;return `<div class="unitwrap"><input class="unitinput" data-r="${r}" data-i="${i}" data-t="w" value="${esc(val??'')}" readonly><span class="unit">kg</span></div>`}
function w3form(){let ed=currentEdit('w3');let rs=[1,2,3,4].map(r=>`<div class="round"><h3>Runde ${r}</h3><label>Tid på runden</label><input data-rt="${r}" value="${esc(ed?.rounds?.[r-1]?.time??'')}" placeholder="f.eks. 03:45" oninput="updateW3Total()">${ex3.map((e,i)=>{let z=ed?.rounds?.[r-1]?.ex?.[e.name],w=z?.w??(e.kind==='kv'||e.kind==='max'?'KV':''),rep=z?.rep??(e.kind==='max'?'':e.reps);return `<div class="row3"><div><b>${e.name}</b><div class="muted">${e.plan}${e.kind==='sharedweight'&&r===1?' • vekten brukes i alle runder':''}</div></div>${e.kind==='kv'||e.kind==='max'?`<input class="kv" value="KV" readonly data-r="${r}" data-i="${i}" data-t="w">`:sharedWeightInput(e,i,r,w)}<div class="unitwrap"><input class="${e.kind==='max'?'edit ':''}unitinput" data-r="${r}" data-i="${i}" data-t="rep" value="${esc(rep)}"><span class="unit">stk</span></div></div>`}).join('')}</div>`).join('');return `${editBanner('w3')}<div class="card ${ed?'editing':''}"><h2>${ed?'Rediger':'Ny'} Økt 3 – ${currentProfile.name}</h2><div class="muted">Alle øvelser = én runde. Kjør så raskt du klarer, 2 min pause, så neste runde. 4 runder totalt. Sumosquat kjøres med kroppsvekt. Sandbag to shoulder og Ground to air bruker samme vekt gjennom hele sirkelen.</div><label>Dato</label><input id="w3date" type="date" value="${ed?.date||today()}">${rs}<label>Total tid inkl. pauser</label><input id="w3tot" class="kv" value="${esc(ed?.total??'')}" placeholder="Beregnes automatisk" readonly><div class="muted" style="margin-top:4px">Beregnes som rundetid 1–4 + tre pauser à 2 minutter.</div><button class="btn" style="margin-top:10px" onclick="saveW3()">${ed?'Oppdater økt':'Lagre økt'}</button></div>`}
function syncCircleWeight(i,val){for(let r=2;r<=4;r++){let el=q(`[data-r="${r}"][data-i="${i}"][data-t="w"]`);if(el)el.value=val}}
async function saveW3(){updateW3Total();let ed=currentEdit('w3'),old=ed?workoutRef('w3',ed):null,rounds=[];for(let r=1;r<=4;r++){let E={};ex3.forEach((e,i)=>{let w=q(`[data-r="${r}"][data-i="${i}"][data-t="w"]`)?.value||'KV',rep=q(`[data-r="${r}"][data-i="${i}"][data-t="rep"]`)?.value||'';E[e.name]={w:w==='KV'?'KV':w,rep}});rounds.push({time:q(`[data-rt="${r}"]`).value,ex:E})}let o={_id:ed?ed._id||old:uid(),date:q('#w3date').value,total:q('#w3tot').value,rounds};if(ed){d.w3[editTarget.i]=o;editTarget=null;await save('Økten er oppdatert')}else{d.w3.push(o);await save()}showPage('w3')}
function ownHistory(k){let arr=d[k]||[];return `<div class="card"><h2>Tidligere ${labelWorkout(k)}</h2>${arr.slice().reverse().map((x,ri)=>{let idx=arr.length-1-ri;return `<div class="plan"><span>${x.date}</span><div>${shortSummary(k,x)}</div><div class="actions" style="margin:0"><button class="btn small secondary" onclick="beginEdit('${k}',${idx})">Rediger</button><button class="btn small danger" onclick="del('${k}',${idx})">Slett</button></div></div>`}).join('')||'<div class="muted">Ingen registreringer ennå.</div>'}</div>`}
async function del(k,i){if(confirm('Slette registreringen?')){if(editTarget?.k===k&&editTarget.i===i)editTarget=null;d[k].splice(i,1);await save('Økten er slettet');showPage(k)}}
function renderPages(){renderHome();renderPerson('Ivan');renderPerson('Espen');if(!isCoach()){q('#w1').innerHTML=w1form()+ownHistory('w1');q('#w2').innerHTML=activity('w2','Økt 2 – frivillig jogg eller gåtur',['Gåtur','Rolig jogg','Kombinert gå/jogg','Annet'],45)+ownHistory('w2');q('#w3').innerHTML=w3form()+ownHistory('w3');q('#w4').innerHTML=activity('w4','Økt 4 – fjelltur eller rolig løpetur',['Fjelltur','Rolig løpetur','Gåtur','Annet'],40)+ownHistory('w4');setTimeout(updateW3Total,0)}}
(async()=>{const {data:{session}}=await sb.auth.getSession();if(session)await startSession(session.user)})();
</script>
</body></html>
